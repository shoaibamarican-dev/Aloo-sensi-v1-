name: Build Aloo Sensi v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Aloo Sensi v1 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make Gradle executable
        working-directory: AlooSensiPro
        run: chmod +x gradlew

      - name: Check Android project
        working-directory: AlooSensiPro
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -x gradlew

      - name: Build Debug APK
        working-directory: AlooSensiPro
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aloo-Sensi-v1-debug
          path: AlooSensiPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
