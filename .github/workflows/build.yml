name: Build Aloo Sensi v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Aloo Sensi v1 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Build Aloo Sensi v1
        working-directory: AlooSensiPro
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Aloo Sensi v1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aloo-Sensi-v1-debug
          path: AlooSensiPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
